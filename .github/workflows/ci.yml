name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  unit-and-api:
    name: Unit + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit + api tests with coverage
        env:
          GROWW_ONLY: "1"
        run: |
          pytest -m "unit or api" \
            --cov=apps --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  e2e:
    name: End-to-end (slow)
    runs-on: ubuntu-latest
    needs: unit-and-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "slow" --maxfail=1

  ui:
    name: UI (Playwright)
    runs-on: ubuntu-latest
    needs: unit-and-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m "ui" --maxfail=1

