[pytest]
# SETUPS test suite configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Where to find the app code (so `from groww_client import ...` works)
pythonpath =
    apps/python/lib
    apps/web/api
    scripts

# Markers (run subsets with: pytest -m "unit")
markers =
    unit: Pure-Python unit tests (no network, no server, <100ms each).
    api:  FastAPI TestClient tests (no external HTTP).
    ui:   Playwright browser tests (requires `playwright install` once).
    slow: Tests that take > 1s (skip with -m "not slow").
    network: Tests that hit the real internet (off by default, -m "network" to enable).

# Quiet + useful output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra
    --color=yes

# Never let a test silently touch real trade_data/ or cache/
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

