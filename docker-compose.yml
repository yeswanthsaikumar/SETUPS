version: "3.9"

services:
  setups-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: setups-web
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./cache:/app/cache
      - ./trade_data:/app/trade_data
    environment:
      - GROWW_API_KEY=${GROWW_API_KEY:-}
      - GROWW_API_SECRET=${GROWW_API_SECRET:-}
      - GROWW_ACCESS_TOKEN=${GROWW_ACCESS_TOKEN:-}
    restart: unless-stopped

