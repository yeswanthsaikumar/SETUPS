<title id="t">Double Bottom - Variations &amp; Verdict</title>
<desc id="d">Double Bottom - Variations &amp; Verdict</desc>
<rect width="1400" height="760" fill="#070d18"/>
<text x="40" y="40" fill="#e5edf8" font-size="24" font-family="Arial, sans-serif" font-weight="700">Double Bottom - Variations &amp; Verdict</text>
<rect x="40" y="70" width="640" height="320" rx="10" fill="#0d1626" stroke="#172338"/>
<text x="56" y="96" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Clean W (equal lows)</text>
<text x="56" y="116" fill="#2ecc71" font-size="13" font-family="Arial, sans-serif">Take it: 2nd low ~ 1st, vol lighter on 2nd</text>
<rect x="56" y="130" width="600" height="240" fill="#0a1322" stroke="#172338"/>
<path d="M56.0 150.0 L96.0 190.0 L136.0 230.0 L176.0 270.0 L216.0 310.0 L256.0 334.0 L296.0 294.0 L336.0 270.0 L376.0 254.0 L416.0 270.0 L456.0 302.0 L496.0 330.0 L536.0 294.0 L576.0 254.0 L616.0 230.0 L656.0 210.0" fill="none" stroke="#2ecc71" stroke-width="2"/>
<rect x="700" y="70" width="640" height="320" rx="10" fill="#0d1626" stroke="#172338"/>
<text x="716" y="96" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Undercut &amp; reclaim (strongest)</text>
<text x="716" y="116" fill="#2ecc71" font-size="13" font-family="Arial, sans-serif">Take it: 2nd low UNDERCUTS then snaps back</text>
<rect x="716" y="130" width="600" height="240" fill="#0a1322" stroke="#172338"/>
<path d="M716.0 150.0 L756.0 190.0 L796.0 230.0 L836.0 270.0 L876.0 310.0 L916.0 334.0 L956.0 294.0 L996.0 270.0 L1036.0 254.0 L1076.0 270.0 L1116.0 310.0 L1156.0 350.0 L1196.0 290.0 L1236.0 250.0 L1276.0 226.0 L1316.0 206.0" fill="none" stroke="#2ecc71" stroke-width="2"/>
<rect x="40" y="410" width="640" height="320" rx="10" fill="#0d1626" stroke="#172338"/>
<text x="56" y="436" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Higher 2nd low</text>
<text x="56" y="456" fill="#2ecc71" font-size="13" font-family="Arial, sans-serif">Take it (acceptable): 2nd low above 1st</text>
<rect x="56" y="470" width="600" height="240" fill="#0a1322" stroke="#172338"/>
<path d="M56.0 490.0 L96.0 530.0 L136.0 570.0 L176.0 610.0 L216.0 650.0 L256.0 674.0 L296.0 634.0 L336.0 610.0 L376.0 594.0 L416.0 610.0 L456.0 634.0 L496.0 654.0 L536.0 622.0 L576.0 590.0 L616.0 570.0 L656.0 550.0" fill="none" stroke="#facc15" stroke-width="2"/>
