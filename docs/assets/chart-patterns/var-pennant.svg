<text x="56" y="436" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Expanding Triangle - widening range (avoid)</text>
<text x="56" y="456" fill="#ff5a6e" font-size="13" font-family="Arial, sans-serif">Avoid: distribution pattern, no controlled coil</text>
