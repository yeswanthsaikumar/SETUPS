<text x="56" y="96" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Bull Pennant - tight coil, fast (A-grade)</text>
<text x="56" y="116" fill="#2ecc71" font-size="13" font-family="Arial, sans-serif">Take it: impulse + coil + expansion</text>
<rect x="56" y="130" width="600" height="240" fill="#0a1322" stroke="#172338"/>
