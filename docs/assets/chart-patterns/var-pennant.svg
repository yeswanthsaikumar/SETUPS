<title id="t">Pennant / Symmetrical Triangle - Variations and Verdict</title>
<desc id="d">Pennant / Symmetrical Triangle - Variations and Verdict</desc>
<rect width="1400" height="760" fill="#070d18"/>
<text x="40" y="40" fill="#e5edf8" font-size="24" font-family="Arial, sans-serif" font-weight="700">Pennant / Symmetrical Triangle - Variations and Verdict</text>
