<text x="716" y="96" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Symmetrical Triangle - wider, multi-week (good)</text>
<text x="716" y="116" fill="#2ecc71" font-size="13" font-family="Arial, sans-serif">Take it: patience needed, vol confirms</text>
