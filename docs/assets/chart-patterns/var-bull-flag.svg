<text x="716" y="436" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Wide &amp; loose flag (avoid)</text>
<text x="716" y="456" fill="#ff5a6e" font-size="13" font-family="Arial, sans-serif">Avoid: wide red candles, vol expanding on red = distribution</text>
