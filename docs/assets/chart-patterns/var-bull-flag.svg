<title id="t">Bull Flag — Variations &amp; Verdict</title>
<desc id="d">Bull Flag — Variations &amp; Verdict</desc>
<rect width="1400" height="760" fill="#070d18"/>
<text x="40" y="40" fill="#e5edf8" font-size="24" font-family="Arial, sans-serif" font-weight="700">Bull Flag — Variations &amp; Verdict</text>
<rect x="40" y="70" width="640" height="320" rx="10" fill="#0d1626" stroke="#172338"/>
<text x="56" y="96" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Tight / shallow flag (A-grade)</text>
<text x="56" y="116" fill="#2ecc71" font-size="13" font-family="Arial, sans-serif">Take it: minimal pullback, vol dries, fast continuation</text>
<rect x="56" y="130" width="600" height="240" fill="#0a1322" stroke="#172338"/>
<path d="M56.0 348.2 L102.2 330.7 L148.3 308.9 L194.5 282.7 L240.6 256.5 L286.8 239.1 L332.9 243.5 L379.1 247.8 L425.2 250.0 L471.4 247.8 L517.5 243.5 L563.7 226.0 L609.8 199.8 L656.0 178.0" fill="none" stroke="#2ecc71" stroke-width="2"/>
<rect x="700" y="70" width="640" height="320" rx="10" fill="#0d1626" stroke="#172338"/>
<text x="716" y="96" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Sideways flag (also strong)</text>
<text x="716" y="116" fill="#2ecc71" font-size="13" font-family="Arial, sans-serif">Take it: orderly drift sideways, dry vol</text>
<rect x="716" y="130" width="600" height="240" fill="#0a1322" stroke="#172338"/>
<path d="M716.0 348.2 L762.2 330.7 L808.3 308.9 L854.5 282.7 L900.6 256.5 L946.8 239.1 L992.9 239.1 L1039.1 243.5 L1085.2 239.1 L1131.4 241.3 L1177.5 239.1 L1223.7 226.0 L1269.8 204.2 L1316.0 178.0" fill="none" stroke="#2ecc71" stroke-width="2"/>
<rect x="40" y="410" width="640" height="320" rx="10" fill="#0d1626" stroke="#172338"/>
<text x="56" y="436" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Deep flag (lower quality)</text>
<text x="56" y="456" fill="#facc15" font-size="13" font-family="Arial, sans-serif">Caution: &gt; 50% pullback of pole, vol can rise</text>
<rect x="56" y="470" width="600" height="240" fill="#0a1322" stroke="#172338"/>
<path d="M56.0 688.2 L102.2 670.7 L148.3 648.9 L194.5 622.7 L240.6 596.5 L286.8 579.1 L332.9 600.9 L379.1 622.7 L425.2 640.2 L471.4 648.9 L517.5 644.5 L563.7 627.1 L609.8 605.3 L656.0 583.5" fill="none" stroke="#facc15" stroke-width="2"/>
