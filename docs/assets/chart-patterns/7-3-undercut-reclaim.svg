<text x="110" y="88.0" fill="#9eb1c7" font-size="13" font-family="Arial, sans-serif" font-weight="600">Decline into key support</text>
<text x="560" y="88.0" fill="#ff5a6e" font-size="13" font-family="Arial, sans-serif" font-weight="600">Undercut: panic flush (climactic vol)</text>
<text x="760" y="88.0" fill="#2ecc71" font-size="13" font-family="Arial, sans-serif" font-weight="600">Reclaim above support = trap reversal</text>
<text x="90" y="590.0" fill="#ff5a6e" font-size="13" font-family="Arial, sans-serif" font-weight="600">Failure = close back below 140 -&gt; exit immediately. Never debate a failed reclaim.</text>
