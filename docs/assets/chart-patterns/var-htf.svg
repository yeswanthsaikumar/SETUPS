<text x="56" y="96" fill="#e5edf8" font-size="16" font-family="Arial, sans-serif" font-weight="600">Classic HTF - 90%+ run, 5-8 bar tight shelf (A-grade)</text>
<text x="56" y="116" fill="#2ecc71" font-size="13" font-family="Arial, sans-serif">Take it: rare, explosive, trail aggressively</text>
