  <text x="1005" y="246" fill="#fda4af" font-size="16" font-family="Arial, sans-serif">Reclaimed level</text>
  <text x="1005" y="316" fill="#fca5a5" font-size="16" font-family="Arial, sans-serif">Exit on failed close</text>
